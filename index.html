<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      // Clinic web addresses: clinixpro.com/<clinic-name> -> clinixpro.com/#/<clinic-name>.
      // On GitHub Pages an unknown path serves 404.html (a copy of this page), so this also runs there.
      // Project sites live under /<repository>/, so that first folder is kept.
      ;(function () {
        if (location.hash.length > 1) return
        var root = /\.github\.io$/.test(location.host) ? '/' + (location.pathname.split('/')[1] || '') + '/' : '/'
        root = root.replace('//', '/')
        var rest = location.pathname.slice(root.length).replace(/index\.html$/, '').replace(/\/+$/, '')
        if (rest && !/\./.test(rest) && rest.indexOf('/') === -1) location.replace(root + '#/' + rest.toLowerCase())
      })()
    </script>
